[project]
name = "cookidoo-mcp"
version = "0.1.0"
description = "MCP server for Cookidoo/Thermomix — find recipes, manage meal calendar and shopping list"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.3",
    # Pinned to PR #203's new-auth branch (commit ad9fb13). Cookidoo deprecated
    # the grant_type=password OAuth flow upstream around 2026-05-08; the released
    # 0.17.0 still uses it and returns 400 unauthorized_client. PR #203 migrates
    # to the browser OAuth2 cookie flow that actually works. Switch back to a
    # released version once the PR is merged (likely 0.18.0+).
    "cookidoo-api @ git+https://github.com/miaucl/cookidoo-api.git@ad9fb139bef44d803e3abde0f92655ed6d172d30",
    "mcp[cli]>=1.26.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
cookidoo-mcp = "cookidoo_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Required because we pin cookidoo-api to a git ref (see comment in
# project.dependencies). Drop this once the pin moves back to a PyPI release.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/cookidoo_mcp"]

[tool.uv]
package = true
